version: "3.8"

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: multi_tenant_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: multi_tenant_admin
      MYSQL_USER: admin
      MYSQL_PASSWORD: adminpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - multi_tenant_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: multi_tenant_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - multi_tenant_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 20s
      retries: 10

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: multi_tenant_backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: mysql://admin:adminpassword@mysql:3306/multi_tenant_admin
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-super-secret-jwt-key-min-32-chars
      JWT_REFRESH_SECRET: your-refresh-token-secret-key
      JWT_EXPIRES_IN: 24h
      JWT_REFRESH_EXPIRES_IN: 7d
      BCRYPT_SALT_ROUNDS: 12
      RATE_LIMIT_MAX: 100
      RATE_LIMIT_WINDOW: 15
      CORS_ORIGIN: http://localhost:3000,http://localhost:3001
      UPLOAD_PATH: ./uploads
      MAX_FILE_SIZE: 10485760
      ALLOWED_FILE_TYPES: jpg,jpeg,png,gif,pdf,doc,docx,xls,xlsx,txt,csv
      LOG_LEVEL: info
      ENABLE_REQUEST_LOGGING: true
    volumes:
      - .:/app
      - /app/node_modules
      - uploads_data:/app/uploads
      - logs_data:/app/logs
      - backups_data:/app/backups
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - multi_tenant_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      timeout: 20s
      retries: 10

  # Adminer (Database Management)
  adminer:
    image: adminer:latest
    container_name: multi_tenant_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      - mysql
    networks:
      - multi_tenant_network

  # Frontend (if needed)
  frontend:
    build:
      context: ../client
      dockerfile: Dockerfile
    container_name: multi_tenant_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
      NODE_ENV: development
    volumes:
      - ../client:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - multi_tenant_network

  # Nginx Reverse Proxy (Production)
  nginx:
    image: nginx:alpine
    container_name: multi_tenant_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - backend
      - frontend
    networks:
      - multi_tenant_network
    profiles:
      - production

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
  logs_data:
    driver: local
  backups_data:
    driver: local

networks:
  multi_tenant_network:
    driver: bridge
